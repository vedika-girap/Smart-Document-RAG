[project]
name = "smart-document-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.14.3",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.60.0",
    "tqdm>=4.70.0",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]